<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rising Star</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f9e9ef;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    120deg,
                    #f8dce7 0%,
                    #f3c9d9 45%,
                    #e9b5c9 100%
                );
        }

        /* Фотография */
        .hero-image {
            position: absolute;
            right: 5%;
            bottom: 0;
            width: 58%;
            height: 90%;
            object-fit: cover;
            object-position: center;
            border-radius: 35px 35px 0 0;
            box-shadow: -20px 0 60px rgba(160, 80, 110, 0.15);
        }

        /* Нежная пелена поверх фотографии */
        .photo-overlay {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 65%;
            height: 90%;
            background: linear-gradient(
                90deg,
                rgba(243, 201, 217, 0.8),
                rgba(243, 201, 217, 0.05)
            );
            pointer-events: none;
        }

        /* Верхнее меню */
        header {
            position: relative;
            z-index: 5;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 38px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.65;
        }

        /* Главный заголовок */
        .title {
            position: absolute;
            z-index: 4;
            left: 6%;
            top: 25%;
            width: 45%;
        }

        .title h1 {
            margin: 0;
            font-size: clamp(70px, 10vw, 150px);
            line-height: 0.82;
            font-weight: 900;
            letter-spacing: -7px;
        }

        .title h1 span {
            display: block;
        }

        /* Адрес */
        .address {
            position: absolute;
            z-index: 5;
            left: 6%;
            bottom: 8%;
            font-size: 17px;
            line-height: 1.5;
            max-width: 270px;
        }

        .address-title {
            font-size: 13px;
            opacity: 0.65;
            margin-bottom: 7px;
        }

        /* Правая часть */
        .info {
            position: absolute;
            z-index: 5;
            right: 6%;
            bottom: 7%;
            width: 300px;
        }

        .small-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .date {
            font-size: 58px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 18px;
        }

        .description {
            font-size: 17px;
            line-height: 1.45;
            margin-bottom: 28px;
        }

        /* Кнопка */
        button {
            width: 100%;
            height: 72px;
            border: none;
            border-radius: 7px;
            background: #ffffff;
            color: #9f4f70;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(100, 40, 70, 0.12);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(100, 40, 70, 0.2);
        }


/* Секрет */
        #secret {
            display: none;
            margin-top: 18px;
            padding: 18px;
            background: rgba(255,255,255,0.9);
            color: #9f4f70;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Телефон */
        max-width: 800px {

            .hero {
                min-height: 100vh;
            }

            header {
                height: 70px;
                padding: 0 25px;
            }

            nav {
                display: none;
            }

            .hero-image {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 55%;
    height: 90%;
    object-fit: cover;
    object-position: center;
    border-radius: 35px 35px 0 0;
    box-shadow: 0 0 60px rgba(160, 80, 110, 0.15);
}

            .photo-overlay {
                width: 100%;
                height: 70%;
            }

            .title {
                left: 25px;
                top: 18%;
                width: 90%;
            }

            .title h1 {
                font-size: 70px;
                letter-spacing: -4px;
            }

            .address {
                left: 25px;
                bottom: 25px;
                font-size: 14px;
            }

            .info {
                right: 25px;
                bottom: 25px;
                width: 210px;
            }

            .date {
                font-size: 38px;
            }

            .description {
                font-size: 14px;
            }

            .small-text {
                font-size: 13px;
            }

            button {
                height: 58px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="hero">

    <!-- ФОТОГРАФИЯ -->
    <img src="hero.jpg" class="hero-image" alt="Главная фотография">

    <div class="photo-overlay"></div>

    <!-- ВЕРХ -->
    <header>

        <div class="logo">
            VI
        </div>

        <nav>
            <a href="#">Что будет?</a>
            <a href="#">Кто будет?</a>
            <a href="#">Что взять?</a>
            <a href="#">О проекте</a>
            <a href="#">Контакты</a>
        </nav>

    </header>

    <!-- ЗАГОЛОВОК -->
    <div class="title">

        <h1>
            <span>Rising</span>
            <span>Star</span>
        </h1>

    </div>

    <!-- АДРЕС -->
    <div class="address">

        <div class="address-title">
            МЕСТО
        </div>

        Нижний Новгород,

        ул. Восходящая, 99А

    </div>

    <!-- ПРАВАЯ ЧАСТЬ -->
    <div class="info">

        <div class="small-text">
            — Добрый проект,

            создатель Виктория
        </div>

        <div class="date">
            09 СЕНТЯБРЯ
        </div>

        <div class="description">
            Сама в шоке с такого.

            Присоединяйся!
        </div>

        <button onclick="openSecret()">
            ОТКРОЙ МЕНЯ
        </button>

        <div id="secret">
            спасибо что открыла! 💗
        </div>

    </div>

</div>

<script>

function openSecret() {

    document.getElementById("secret").style.display = "block";

}

</script>

</body>
</html>
